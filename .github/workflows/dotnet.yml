
name: Build NEXUS CONSOLE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build EXE
        run: dotnet publish src/Nexus.App/Nexus.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-CONSOLE-Windows-x64
          path: publish/
